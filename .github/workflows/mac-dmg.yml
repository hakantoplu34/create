name: Mac uygulamasını derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gömülü araçları indir (yt-dlp, ffmpeg)
        run: |
          set -euo pipefail
          mkdir -p bin/arm64 bin/x64
          # yt-dlp_macos tek dosya, hem Apple Silicon hem Intel'de çalışır.
          curl -fsSL -o bin/arm64/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          cp bin/arm64/yt-dlp bin/x64/yt-dlp
          # Statik ffmpeg, mimari başına.
          curl -fsSL -o /tmp/ff-arm64.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip
          curl -fsSL -o /tmp/ff-x64.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release/ffmpeg.zip
          unzip -o -j /tmp/ff-arm64.zip ffmpeg -d bin/arm64
          unzip -o -j /tmp/ff-x64.zip ffmpeg -d bin/x64
          chmod +x bin/*/*
          file bin/*/*
          bin/arm64/ffmpeg -version | head -1
          bin/arm64/yt-dlp --version

      - run: npm install --no-audit --no-fund

      - name: dmg üret (Apple Silicon ve Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      # dmg'yi bir kullanıcı gibi kur, aç, ekran görüntüsü al. Çökerse sürüm yayınlanmaz.
      - name: Açılış testi (Apple Silicon)
        run: |
          set -uo pipefail
          hdiutil attach dist/Ilham-*-arm64.dmg -mountpoint /tmp/ilham-dmg -nobrowse
          cp -R /tmp/ilham-dmg/Ilham.app /Applications/
          hdiutil detach /tmp/ilham-dmg
          xattr -cr /Applications/Ilham.app
          mkdir -p testler
          /Applications/Ilham.app/Contents/Resources/bin/ffmpeg -version | head -1
          /Applications/Ilham.app/Contents/Resources/bin/yt-dlp --version
          ILHAM_DATA="$RUNNER_TEMP/ilham-veri" \
          ILHAM_SHOT="$PWD/testler/1-arsiv.png,$PWD/testler/2-hesaplar.png,$PWD/testler/3-ayarlar.png" \
          ILHAM_SHOT_JS="0||document.querySelector('[data-view=hesaplar]').click()||document.querySelector('[data-view=ayarlar]').click()" \
            perl -e 'alarm 120; exec @ARGV' /Applications/Ilham.app/Contents/MacOS/Ilham > testler/cikti.txt 2>&1
          code=$?
          echo "Çıkış kodu: $code"
          tail -40 testler/cikti.txt
          test "$code" -eq 0 && test -s testler/3-ayarlar.png

      - name: Test görüntülerini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acilis-testi
          path: testler/

      - name: Sürüm sayfasına yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: İlham ${{ github.run_number }}. yapı
          body: |
            **Apple Silicon (M1, M2, M3, M4):** Ilham-*-arm64.dmg
            **Intel işlemcili Mac:** Ilham-*-x64.dmg

            Kurulum: dmg'yi aç, İlham'ı Applications klasörüne sürükle. İlk açılışta: Sistem Ayarları > Gizlilik ve Güvenlik > Yine de Aç (ya da Terminal: xattr -cr /Applications/Ilham.app).
          files: dist/*.dmg
          make_latest: true
